apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: firstclick-hpa
  namespace: firstclick
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: firstclick
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 10
